name: CI

on:
  pull_request:
    branches: [desarrollo, despliegue]
  push:
    branches: [desarrollo]

jobs:
  panel-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/panel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/panel-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ia-microservicio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ia-microservicio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ia-microservicio/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  app-movil:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app-movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/app-movil/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
